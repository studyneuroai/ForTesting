<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение на свадьбу</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background-color: #faf7f2;
      color: #3a332c;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #ede6dc;
    }
    .subtitle {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8c7a6b;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 36px;
      font-weight: normal;
      margin: 10px 0 20px;
      color: #2c2520;
    }
    .date {
      font-size: 20px;
      padding: 12px 0;
      border-top: 1px solid #ede6dc;
      border-bottom: 1px solid #ede6dc;
      margin: 25px 0;
    }
    .info {
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #5c5248;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background-color: #8c7a6b;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="subtitle">Приглашение на свадьбу</div>
    <h1>Александр &amp; Елена</h1>
    <p class="info">Дорогие родные и друзья! Мы будем счастливы разделить с вами один из самых важных дней нашей жизни.</p>
    
    <div class="date">15 августа 2027 • 16:00</div>
    
    <div class="info">
      <strong>Место проведения:</strong><br>
      Ресторан «Усадьба», зал «Белый»<br>
      г. Москва, ул. Парковая, д. 12
    </div>

    <a href="https://t.me" class="btn">Подтвердить в Telegram</a>
  </div>
</body>
</html>
